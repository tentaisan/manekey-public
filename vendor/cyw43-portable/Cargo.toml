# Modified for standalone dependencies and Arm-only Cortex-M runtime dependencies.
# Source: https://github.com/embassy-rs/embassy/tree/0af1937a5ac77f52fea943b677088c38ef9e91c6/cyw43
[package]
name = "cyw43"
version = "0.7.0"
edition = "2024"
description = "Rust driver for the CYW43439 WiFi chip, used in the Raspberry Pi Pico W."
keywords = ["embedded", "cyw43", "embassy-net", "embedded-hal-async", "wifi"]
categories = ["embedded", "hardware-support", "no-std", "network-programming", "asynchronous"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/embassy-rs/embassy"
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = false

[[package.metadata.embassy.build]]
target = "thumbv6m-none-eabi"
features = []

[[package.metadata.embassy.build]]
target = "thumbv6m-none-eabi"
features = ["log"]

[[package.metadata.embassy.build]]
target = "thumbv6m-none-eabi"
features = ["defmt"]

[[package.metadata.embassy.build]]
target = "thumbv6m-none-eabi"
features = ["firmware-logs", "log"]

[[package.metadata.embassy.build]]
target = "thumbv6m-none-eabi"
features = ["defmt", "firmware-logs"]

[[package.metadata.embassy.build]]
target = "thumbv6m-none-eabi"
features = ["bluetooth", "firmware-logs", "log"]

[[package.metadata.embassy.build]]
target = "thumbv6m-none-eabi"
features = ["bluetooth", "defmt", "firmware-logs"]

[package.metadata.embassy_docs]
src_base = "https://github.com/embassy-rs/embassy/blob/cyw43-v$VERSION/cyw43/src/"
src_base_git = "https://github.com/embassy-rs/embassy/blob/$COMMIT/cyw43/src/"
target = "thumbv6m-none-eabi"
features = ["defmt", "firmware-logs"]

[package.metadata.docs.rs]
features = ["defmt", "firmware-logs"]

[features]
defmt = ["dep:defmt", "heapless/defmt", "embassy-time/defmt", "bt-hci?/defmt", "embedded-io-async?/defmt"]
log = ["dep:log", "dep:derive_more", "derive_more/display"]
bluetooth = ["dep:bt-hci", "dep:bt-hci-transport", "dep:embedded-io-async"]
firmware-logs = []

[dependencies]
embassy-time = "0.5.1"
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
sdio = "0.5.0"
heapless = "0.9"
aligned = "0.4.3"
trait-set = "0.3.0"

[dependencies.embassy-net-driver-channel]
path = "../embassy-net-driver-channel-portable"

[dependencies.defmt]
version = "1.0.1"
optional = true

[dependencies.log]
version = "0.4.17"
optional = true

[dependencies.derive_more]
version = "2.1.1"
optional = true
default-features = false

[dependencies.futures]
version = "0.3.17"
default-features = false
features = ["async-await", "cfg-target-has-atomic", "unstable"]

[dependencies.embedded-hal-1]
package = "embedded-hal"
version = "1.0"

[dependencies.embedded-hal-async]
version = "1.0"

[dependencies.embedded-io-async]
version = "0.7.0"
optional = true

[dependencies.bt-hci]
version = "0.9.0"
optional = true

[dependencies.bt-hci-transport]
version = "0.1.0"
optional = true

[target."cfg(target_arch = \"arm\")".dependencies]
cortex-m = "0.7.6"
cortex-m-rt = "0.7.0"
