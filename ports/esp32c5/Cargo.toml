[package]
edition = "2024"
name = "esp32c5"
version = "0.1.0"
license = "AGPL-3.0-only"
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = false

[features]
default = ["log-uart", "ble"]
ble = ["dep:embassy-executor", "dep:embassy-futures", "dep:embassy-sync", "dep:embassy-time", "dep:esp-alloc", "dep:esp-radio", "dep:esp-rtos", "dep:heapless", "dep:log", "dep:static_cell", "dep:trouble-host"]
ble-security = ["ble", "trouble-host/log", "trouble-host/security"]
ble-bonded-only = ["ble-security"]
ble-dual-task = ["client-pin-flash", "ble-bonded-only"]
internal-uart = ["client-pin-flash"]
flash-managed-keys = ["client-pin-volatile", "shared-flash"]
flash-managed-key-setup = ["flash-managed-keys"]
experimental-ml-dsa-mldsa-native = ["client-pin-flash", "manekey/trusted-boundary-ml-dsa-mldsa-native-experimental"]
ble-ml-dsa-native = ["experimental-ml-dsa-mldsa-native"]
client-pin-volatile = ["dep:embassy-sync", "dep:static_cell"]
shared-flash = ["dep:embassy-sync"]
client-pin-flash = ["client-pin-volatile", "ble-security", "shared-flash"]
log-uart = ["esp-println/uart"]
log-jtag-serial = ["esp-println/jtag-serial"]
experimental-ml-dsa-fips204 = ["client-pin-flash", "manekey/trusted-boundary-ml-dsa-fips204-experimental"]
ml-dsa-integrated-layout = ["experimental-ml-dsa-fips204"]
ml-dsa-dual-task-experimental = ["ble-dual-task", "ml-dsa-integrated-layout"]
trusted-call-local-bridge = ["client-pin-flash"]
pmp-baremetal = ["manekey/riscv-ecall-backend", "manekey/riscv-pmp-event-mailbox"]
adc-entropy = []
pmp-persistent-pin = ["client-pin-volatile", "shared-flash", "adc-entropy"]
pmp-internal-uart-fido = ["pmp-baremetal", "pmp-persistent-pin", "adc-entropy"]
pmp-internal-uart-ml-dsa = ["pmp-internal-uart-fido", "manekey/experimental-large-message-buffers"]
pmp-internal-uart-ml-dsa-fips204 = ["pmp-internal-uart-ml-dsa", "manekey/trusted-boundary-ml-dsa-fips204-experimental"]
pmp-internal-uart-ml-dsa-fips204-scratch = ["pmp-internal-uart-ml-dsa", "manekey/experimental-ml-dsa-fips204-scratch", "dep:manekey-fips204-scratch"]
pmp-internal-uart-ml-dsa-mldsa-native = ["pmp-internal-uart-ml-dsa", "manekey/trusted-boundary-ml-dsa-mldsa-native-experimental"]
up-always-present = []

[dependencies]
embedded-storage = "0.3"
nb = "1"

[dependencies.embassy-executor]
version = "0.10"
optional = true

[dependencies.embassy-futures]
version = "0.1"
optional = true

[dependencies.embassy-sync]
version = "0.7"
optional = true

[dependencies.embassy-time]
version = "0.5"
optional = true

[dependencies.esp-alloc]
git = "https://github.com/esp-rs/esp-hal"
rev = "54c2374e"
package = "esp-alloc"
optional = true

[dependencies.esp-backtrace]
git = "https://github.com/esp-rs/esp-hal"
rev = "54c2374e"
package = "esp-backtrace"
default-features = false
features = ["esp32c5", "panic-handler", "println"]

[dependencies.esp-bootloader-esp-idf]
git = "https://github.com/esp-rs/esp-hal"
rev = "54c2374e"
package = "esp-bootloader-esp-idf"
default-features = false
features = ["esp32c5"]

[dependencies.esp-hal]
git = "https://github.com/esp-rs/esp-hal"
rev = "54c2374e"
package = "esp-hal"
default-features = false
features = ["esp32c5", "log-04", "rt", "unstable"]

[dependencies.esp-println]
git = "https://github.com/esp-rs/esp-hal"
rev = "54c2374e"
package = "esp-println"
default-features = false
features = ["esp32c5", "log-04", "critical-section"]

[dependencies.esp-radio]
git = "https://github.com/esp-rs/esp-hal"
rev = "54c2374e"
package = "esp-radio"
default-features = true
optional = true
features = ["esp32c5", "ble", "log-04", "unstable"]

[dependencies.esp-radio-rtos-driver]
git = "https://github.com/esp-rs/esp-hal"
rev = "54c2374e"
package = "esp-radio-rtos-driver"
optional = true

[dependencies.esp-rtos]
git = "https://github.com/esp-rs/esp-hal"
rev = "54c2374e"
package = "esp-rtos"
default-features = false
optional = true
features = ["esp32c5", "embassy", "esp-alloc", "esp-radio", "log-04"]

[dependencies.esp-storage]
git = "https://github.com/esp-rs/esp-hal"
rev = "54c2374e"
package = "esp-storage"
default-features = true
features = ["esp32c5", "bytewise-read"]

[dependencies.heapless]
version = "0.9"
optional = true

[dependencies.log]
version = "0.4"
optional = true

[dependencies.manekey]
path = "../.."
default-features = false

[dependencies.manekey-fips204-scratch]
path = "../../crates/crypto/fips204-scratch"
default-features = false
features = ["ml-dsa-44"]
optional = true

[dependencies.static_cell]
version = "2"
optional = true

[dependencies.trouble-host]
version = "0.7"
optional = true
features = ["default-packet-pool-mtu-255", "derive", "scan"]

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 2
overflow-checks = true
panic = "abort"

[profile.dev.package.esp-radio]
opt-level = 3

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 3
overflow-checks = false
panic = "abort"

[patch.crates-io.embassy-embedded-hal]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-executor]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-executor-macros]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-futures]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-hal-internal]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-sync]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-time]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-time-driver]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-time-queue-utils]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[[bin]]
name = "esp32c5_ble_fido"
path = "src/bin/products/esp32c5_ble_fido.rs"
required-features = ["ble"]

[[bin]]
name = "esp32c5_ble_secure_fido"
path = "src/bin/products/esp32c5_ble_secure_fido.rs"
required-features = ["client-pin-flash"]

[[bin]]
name = "esp32c5_ble_internal_uart_fido"
path = "src/bin/products/esp32c5_ble_internal_uart_fido.rs"
required-features = ["internal-uart"]

[[bin]]
name = "esp32c5_pmp_internal_uart_fido"
path = "src/bin/products/esp32c5_pmp_internal_uart_fido.rs"
required-features = ["pmp-internal-uart-fido"]

[workspace]
