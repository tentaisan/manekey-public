[package]
edition = "2024"
name = "manekey-esp32"
version = "0.1.0"
license = "AGPL-3.0-only"
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = false

[features]
default = []
internal-uart = ["client-pin-flash"]
flash-managed-keys = ["internal-uart"]
flash-managed-key-setup = ["flash-managed-keys"]
managed-internal-uart = ["flash-managed-keys", "ble-bonded-only"]
up-always-present = []
client-pin-volatile = []
shared-flash = []
experimental-ml-dsa-fips204 = ["manekey/trusted-boundary-ml-dsa-fips204-experimental"]
experimental-ml-dsa-fips204-scratch = ["manekey/experimental-ml-dsa-fips204-scratch", "manekey/experimental-large-message-buffers", "dep:manekey-fips204-scratch"]
experimental-ml-dsa-mldsa-native = ["manekey/trusted-boundary-ml-dsa-mldsa-native-experimental"]
board-devkit-v1 = []
ble = ["dep:embassy-executor", "dep:embassy-futures", "dep:embassy-sync", "dep:embassy-time", "dep:esp-alloc", "dep:esp-radio", "dep:esp-rtos", "dep:heapless", "dep:log", "dep:static_cell", "dep:trouble-host"]
ble-security = ["ble", "trouble-host/log", "trouble-host/security"]
ble-bonded-only = ["ble-security"]
client-pin-flash = ["ble-security", "client-pin-volatile"]
ble-dual-task = ["client-pin-flash"]
ble-dual-core = ["client-pin-flash", "multicore-flash"]
multicore-flash = []

[dependencies]
embedded-storage = "0.3"
nb = "1"

[dependencies.manekey-fips204-scratch]
path = "../../crates/crypto/fips204-scratch"
default-features = false
features = ["ml-dsa-44"]
optional = true

[dependencies.embassy-executor]
version = "0.10"
optional = true

[dependencies.embassy-futures]
version = "0.1"
optional = true

[dependencies.embassy-sync]
version = "0.7"
optional = true

[dependencies.embassy-time]
version = "0.5"
optional = true

[dependencies.esp-alloc]
git = "https://github.com/esp-rs/esp-hal"
rev = "54c2374e"
package = "esp-alloc"
optional = true

[dependencies.esp-backtrace]
git = "https://github.com/esp-rs/esp-hal"
rev = "54c2374e"
package = "esp-backtrace"
default-features = false
features = ["esp32", "panic-handler", "println"]

[dependencies.esp-bootloader-esp-idf]
git = "https://github.com/esp-rs/esp-hal"
rev = "54c2374e"
package = "esp-bootloader-esp-idf"
default-features = false
features = ["esp32"]

[dependencies.esp-hal]
git = "https://github.com/esp-rs/esp-hal"
rev = "54c2374e"
package = "esp-hal"
default-features = false
features = ["esp32", "exception-handler", "log-04", "rt", "unstable"]

[dependencies.esp-println]
git = "https://github.com/esp-rs/esp-hal"
rev = "54c2374e"
package = "esp-println"
default-features = false
features = ["esp32", "log-04", "critical-section", "uart"]

[dependencies.esp-radio]
git = "https://github.com/esp-rs/esp-hal"
rev = "54c2374e"
package = "esp-radio"
default-features = true
optional = true
features = ["esp32", "ble", "log-04", "unstable"]

[dependencies.esp-rtos]
git = "https://github.com/esp-rs/esp-hal"
rev = "54c2374e"
package = "esp-rtos"
default-features = false
optional = true
features = ["esp32", "embassy", "esp-alloc", "esp-radio", "log-04"]

[dependencies.esp-storage]
git = "https://github.com/esp-rs/esp-hal"
rev = "54c2374e"
package = "esp-storage"
default-features = true
features = ["esp32", "bytewise-read"]

[dependencies.heapless]
version = "0.9"
optional = true

[dependencies.log]
version = "0.4"
optional = true

[dependencies.manekey]
path = "../.."
default-features = false

[dependencies.trusted-boundary]
path = "../../crates/trusted-boundary"

[dependencies.static_cell]
version = "2"
optional = true

[dependencies.trouble-host]
version = "0.7"
optional = true
features = ["default-packet-pool-mtu-255", "derive"]

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 2
overflow-checks = true
panic = "abort"

[profile.dev.package.esp-radio]
opt-level = 3

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 3
overflow-checks = false
panic = "abort"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(feature, values(\"board-ui\", \"usb-ble-multi\", \"log-uart\", \"flash-managed-keys\"))"]

[patch.crates-io.embassy-embedded-hal]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-executor]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-executor-macros]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-futures]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-hal-internal]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-sync]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-time]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-time-driver]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-time-queue-utils]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[[bin]]
name = "esp32_ble_internal_uart_fido"
path = "src/bin/products/esp32_ble_internal_uart_fido.rs"
required-features = ["internal-uart"]

[[bin]]
name = "esp32_ble_fido"
path = "src/bin/products/esp32_ble_fido.rs"
required-features = ["ble"]

[[bin]]
name = "esp32_ble_secure_fido"
path = "src/bin/products/esp32_ble_secure_fido.rs"
required-features = ["client-pin-flash"]

[workspace]
