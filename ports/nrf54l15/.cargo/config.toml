[build]
target = "thumbv8m.main-none-eabihf"

[target."cfg(all(target_arch = \"arm\", target_os = \"none\"))"]
linker = "flip-link"
rustflags = ["-C", "link-arg=--nmagic", "-C", "link-arg=-Tlink.x", "-C", "link-arg=-Tdefmt.x", "-C", "no-vectorize-loops"]

[env]
DEFMT_LOG = "info"
EMBASSY_EXECUTOR_TASK_ARENA_SIZE = "8192"
