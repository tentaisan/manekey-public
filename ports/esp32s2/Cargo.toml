[package]
edition = "2024"
name = "esp32s2"
version = "0.1.0"
license = "AGPL-3.0-only"
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = false

[features]
default = ["log-uart", "usb-hid"]
client-pin-volatile = ["dep:embassy-sync", "dep:embassy-time", "dep:static_cell"]
client-pin-flash = ["client-pin-volatile"]
usb-dual-task = ["usb-hid", "client-pin-flash"]
internal-uart = ["usb-ccid-experimental"]
flash-managed-keys = ["client-pin-flash", "ml-dsa-memory-layout"]
flash-managed-key-setup = ["flash-managed-keys"]
managed-internal-uart = ["internal-uart", "flash-managed-keys"]
up-always-present = ["client-pin-flash"]
experimental-ml-dsa-fips204-scratch = ["manekey/experimental-large-message-buffers", "manekey/experimental-ml-dsa-fips204-scratch", "dep:manekey-fips204-scratch"]
experimental-ml-dsa-mldsa-native = ["manekey/trusted-boundary-ml-dsa-mldsa-native-experimental"]
ml-dsa-memory-layout = []
experimental-ml-dsa-fips204 = ["manekey/trusted-boundary-ml-dsa-fips204-experimental"]
ml-dsa-integrated-layout = ["experimental-ml-dsa-fips204", "ml-dsa-memory-layout"]
usb-ccid-experimental = ["usb-hid", "client-pin-flash", "manekey/embassy-usb-transport"]
usb-hid = ["dep:embassy-executor", "dep:embassy-futures", "dep:embassy-time", "dep:embassy-usb", "dep:esp-alloc", "dep:esp-rtos", "dep:static_cell"]
log-uart = ["esp-println/uart"]

[dependencies]
embedded-storage = "0.3"
nb = "1"

[dependencies.embassy-executor]
version = "0.10"
optional = true

[dependencies.embassy-futures]
version = "0.1"
optional = true

[dependencies.embassy-sync]
version = "0.7"
optional = true

[dependencies.embassy-time]
version = "0.5"
optional = true

[dependencies.embassy-usb]
version = "0.6"
optional = true

[dependencies.esp-alloc]
git = "https://github.com/esp-rs/esp-hal"
rev = "54c2374e"
package = "esp-alloc"
optional = true

[dependencies.esp-backtrace]
git = "https://github.com/esp-rs/esp-hal"
rev = "54c2374e"
package = "esp-backtrace"
default-features = false
features = ["esp32s2", "panic-handler", "println"]

[dependencies.esp-bootloader-esp-idf]
git = "https://github.com/esp-rs/esp-hal"
rev = "54c2374e"
package = "esp-bootloader-esp-idf"
default-features = false
features = ["esp32s2"]

[dependencies.esp-hal]
git = "https://github.com/esp-rs/esp-hal"
rev = "54c2374e"
package = "esp-hal"
default-features = false
features = ["esp32s2", "exception-handler", "log-04", "rt", "unstable"]

[dependencies.esp-println]
git = "https://github.com/esp-rs/esp-hal"
rev = "54c2374e"
package = "esp-println"
default-features = false
features = ["esp32s2", "log-04", "critical-section"]

[dependencies.esp-rtos]
git = "https://github.com/esp-rs/esp-hal"
rev = "54c2374e"
package = "esp-rtos"
default-features = false
optional = true
features = ["esp32s2", "embassy", "esp-alloc", "log-04"]

[dependencies.esp-storage]
git = "https://github.com/esp-rs/esp-hal"
rev = "54c2374e"
package = "esp-storage"
default-features = true
features = ["esp32s2", "bytewise-read"]

[dependencies.manekey]
path = "../.."
default-features = false

[dependencies.manekey-fips204-scratch]
path = "../../crates/crypto/fips204-scratch"
default-features = false
features = ["ml-dsa-44"]
optional = true

[dependencies.static_cell]
version = "2"
optional = true

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 2
overflow-checks = true
panic = "abort"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 3
overflow-checks = false
panic = "abort"

[patch.crates-io.embassy-embedded-hal]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-executor]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-executor-macros]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-futures]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-hal-internal]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-sync]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-time]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-time-driver]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-time-queue-utils]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-usb]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[patch.crates-io.embassy-usb-driver]
git = "https://github.com/embassy-rs/embassy"
branch = "main"

[[bin]]
name = "esp32s2_usb_fido"
path = "src/bin/esp32s2_usb_fido.rs"
required-features = ["usb-hid"]

[workspace]
