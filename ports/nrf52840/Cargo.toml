[package]
edition = "2024"
name = "nrf52840"
version = "0.1.0"
license = "AGPL-3.0-only"
autobins = false
autoexamples = false
autotests = false
autobenches = false
readme = false

[dependencies]
cortex-m-rt = "0.7"
critical-section = "1"
defmt = "1"
defmt-rtt = "1"
embassy-futures = "0.1.2"
embassy-sync = "0.5"
heapless = "0.8"
nrf-usbd = "0.3"
nrf52840-pac = "0.12"
panic-halt = "1"
static_cell = "2"
usb-device = "0.3"

[dependencies.cortex-m]
version = "0.7"
features = ["critical-section-single-core"]

[dependencies.embassy-executor]
version = "0.10"
features = ["platform-cortex-m", "executor-thread"]

[dependencies.manekey]
path = "../.."
default-features = false

[dependencies.nrf-softdevice]
version = "0.1"
features = ["nrf52840", "s140", "ble-peripheral", "ble-gatt-server"]

[dependencies.manekey-fips204-scratch]
path = "../../crates/crypto/fips204-scratch"
default-features = false
features = ["ml-dsa-44"]
optional = true

[features]
default = []
nrf-dual-task = []
nrf-internal-uart = ["nrf-usb-ccid"]
nrf-usb-ccid = []
nrf-mpu-product = ["client-pin-flash-storage", "nrf-usb-full-ram", "nrf-internal-uart", "nrf-usb-ccid", "manekey/arm-m-frontend"]
nrf-ble-mpu-product = ["nrf-multi-transport", "nrf-ccid-experimental", "nrf-internal-uart", "ble-bonded-only", "manekey/arm-m-thread-once"]
nrf-multi-transport = ["client-pin-flash-storage", "ble-security"]
nrf-ccid-experimental = ["nrf-multi-transport"]
nrf-flash-storage = []
nrf-flash-managed-keys = ["client-pin-flash-storage"]
nrf-flash-managed-key-setup = ["nrf-flash-managed-keys"]
nrf-cryptocell-sha256 = []
nrf-cryptocell-p256 = []
client-pin-volatile = ["nrf-cryptocell-sha256"]
client-pin-flash-storage = ["client-pin-volatile", "nrf-flash-storage"]
hmac-secret = ["client-pin-volatile", "manekey/hmac-secret"]
cred-blob = ["manekey/cred-blob"]
experimental-p256-accelerator = ["client-pin-volatile", "nrf-cryptocell-p256"]
ble-security = ["nrf-softdevice/ble-sec"]
ble-bonded-only = ["ble-security", "nrf-flash-storage"]
up-always-present = []
nrf-usb-full-ram = []
experimental-ml-dsa-fips204 = ["manekey/experimental-ml-dsa-fips204", "manekey/experimental-large-message-buffers", "manekey/trusted-no-private-request-copy"]
experimental-ml-dsa-fips204-scratch = ["experimental-ml-dsa-fips204", "manekey/experimental-ml-dsa-fips204-scratch", "dep:manekey-fips204-scratch"]
experimental-ml-dsa-mldsa-native = ["experimental-ml-dsa-fips204", "manekey/experimental-ml-dsa-mldsa-native"]

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 2
overflow-checks = true
panic = "abort"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 3
overflow-checks = false
panic = "abort"

[[bin]]
name = "nrf52840_ble_fido"
path = "src/bin/products/nrf52840_ble_fido.rs"

[[bin]]
name = "nrf52840_usb_fido"
path = "src/bin/products/nrf52840_usb_fido.rs"

[[bin]]
name = "nrf52840_internal_usb_fido"
path = "src/bin/products/nrf52840_internal_usb_fido.rs"
required-features = ["nrf-internal-uart", "client-pin-flash-storage"]

[[bin]]
name = "nrf52840_mpu_internal"
path = "src/bin/products/nrf52840_mpu_internal.rs"
required-features = ["nrf-mpu-product"]

[workspace]
